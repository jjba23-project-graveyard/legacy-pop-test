poppenspeler:
  pop_services:
    - id: "green-energy-mix"
      name: "Green Energy Mix"
      dir: "/home/joe/Ontwikkeling/Werk/Vandebron"
      base_url: "http://localhost:50000"
      start_cmd: "sbt \"greenEnergyMix/run\""
      env_vars:
        NATIONAAL_ENERGIE_DASHBOARD_TOKEN: "002b9a99a4d98cdee8aabf3abb0778cb649126ffbffc1bcde516884797809ce9"
      health_check:
        path: "/health"
        patience_seconds: 60

  pop_checks:
    - check_url: "/api/v1/forecast"
      service_id: "green-energy-mix"
      expected_code: 200
      body_patterns:
        - pattern: ".meta.forecastDate"
          condition: "!= \"\""
        - pattern: ".data[0].load"
          condition: "> 0"
        - pattern: ".data[0].solar"
          condition: ">= 0"
