pop_services:
  - id: 'consumer-solar-steering'
    dir: '$HOME/Ontwikkeling/Werk/Vandebron'
    base_url: 'http://localhost:8222'
    start_cmd_args:
      - 'sbt "consumerSolarSteering/run"'
    health_check:
      path: '/health'
      patience_seconds: 180
    postgres:
      enabled: true
    kafka:
      enabled: true
    keycloak:
      enabled: true        
    pop_server:
      enabled: true
      url_vars:
        - 'SOLAREDGE_BASE_URL'
        - 'SOLAREDGE_ONBOARDING_BASE_URL'


pop_actions:
  - name: 'Publish a Kafka message to the negative tariff topic'
    kafka_topic: 'negative-tariff-periods'
    message: |
      {"start": "2025-02-18T00:00:00Z", "end": "2025-02-18T22:00:00Z"}
      
  - name: 'Publish another Kafka message to the negative tariff topic'
    kafka_topic: 'negative-tariff-periods'
    message: |
      {"start": "2025-02-19T11:00:00Z", "end": "2025-02-20T22:00:00Z"}      

  - name: 'Check that the steering schedule got recorded in the database'
    delay_seconds: 8
    postgres_query: |
      SELECT id, steering_group_id, start, "end",
          priority, value, created_at,
          cancelled_at, overrides_id
      FROM steering_schedules
      WHERE start = '2025-02-18T00:00:00Z'
      ORDER BY created_at DESC 
    assert_row_count: 1
    assert_expressions:
      - |
        [0] ((uuid)
             (uuid)
             (== 2025-02-18T00:00:00+00:00)
             (== 2025-02-18T22:00:00+00:00)
             (== 1)
             (== 0)
             (non-empty-str)
             (nil)
             (nil))
             
  - name: 'Check that the other steering schedule got recorded in the database'
    delay_seconds: 8
    postgres_query: |
      SELECT id, steering_group_id, start, "end",
          priority, value, created_at,
          cancelled_at, overrides_id
      FROM steering_schedules
      WHERE start = '2025-02-19T11:00:00Z'
      ORDER BY created_at DESC 
    assert_row_count: 1
    assert_expressions:
      - |
        [0] ((uuid)
             (uuid)
             (== 2025-02-19T11:00:00+00:00)
             (== 2025-02-20T22:00:00+00:00)
             (== 1)
             (== 0)
             (non-empty-str)
             (nil)
             (nil))             

pop_keycloak:
  enabled: true
  realm: 'vandebron'
  client_id: 'batterypack-services'
  client_secret: 'test'
  email: 'battery@pack.com'
  username: 'batterpack-services'
  password: 'test'
  roles:
    - 'FLEXIOT-READONLY'
    - 'FLEXIOT_UPDATE'
    - 'FLEXIOT-ADMIN'
  scopes:
    - 'urn:vandebron:batterypack:read'
    - 'urn:vandebron:batterypack:write'

pop_postgres:
  enabled: true

pop_kafka:
  enabled: true

pop_server:
  enabled: true

        
