pop_test:
  pop_services:
    - id: "dynamic-tariff-charging"
      dir: "$HOME/Ontwikkeling/Werk/Vandebron"
      base_url: "http://localhost:8222"
      start_cmd_args:
        - 'sbt "dynamicTariffCharging/run"'
      env_vars:
        SOME_TOKEN: "a"
      health_check:
        path: "/health"
        patience_seconds: 90

  pop_checks:
    - check_url: "/api/v1/vehicles/2c7f6e13-59ea-4aea-bacc-a226fbd19abd/session-history"
      service_id: "dynamic-tariff-charging"
      json_body_patterns:
        - pattern: '"meta""forecastDate"'
          condition: '!= ""'
        - pattern: '"data"[0]"load"'
          condition: "> 0"
        - pattern: '"data"[0]"solar"'
          condition: ">= 0"

  pop_postgres:
    image_name: "postgres"
    image_tag: "17.2"
    host_var: "POSTGRES_HOST"
    port_var: "POSTGRES_PORT"
    db_var: "POSTGRES_DB"
    user_var: "POSTGRES_USER"
    pass_var: "POSTGRES_PASSWORD"
    
  pop_kafka:
    image_name: "confluentinc/cp-kafka"
    image_tag: "6.1.1"
    bootstrap_server_var: "KAFKA_BOOTSTRAP_SERVER"
