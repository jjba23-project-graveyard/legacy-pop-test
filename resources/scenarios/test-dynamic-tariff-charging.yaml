pop_test:
  pop_services:
    - id: "dynamic-tariff-charging"
      dir: "$HOME/Ontwikkeling/Werk/Vandebron"
      base_url: "http://localhost:8222"
      start_cmd_args:
        - 'sbt "dynamicTariffCharging/run"'
      env_vars:
        SOME_TOKEN: "a"
      health_check:
        path: "/health"
        patience_seconds: 180
      postgres:
        enabled: true
      kafka:
        enabled: true
      keycloak:
        enabled: true        
      pop_server:
        enabled: true
        url_vars:
          - "OCPP_FACADE_URL"
          - "DYNAMIC_TARIFF_SERVICE_URL"


  pop_checks:
    - check_url: "/api/v1/registeredChargepoints/3514fbab-9a15-4869-9a7d-895e9dfb3560"
      service_id: "dynamic-tariff-charging"
      delay_seconds: 60
      json_body_patterns:
        - pattern: '"data""vehicleId"'
          condition: '!= ""'

  pop_keycloak:
    enabled: true

  pop_postgres:
    enabled: true
    
  pop_kafka:
    enabled: true

  pop_server:
    enabled: true

        
