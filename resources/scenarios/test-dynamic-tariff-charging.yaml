pop_test:
  pop_services:
    - id: "dynamic-tariff-charging"
      dir: "$HOME/Ontwikkeling/Werk/Vandebron"
      base_url: "http://localhost:8222"
      start_cmd_args:
        - 'sbt "dynamicTariffCharging/run"'
      env_vars:
        SOME_TOKEN: "a"
      health_check:
        path: "/health"
        patience_seconds: 90
      postgres:
        enabled: true
      kafka:
        enabled: true

  pop_postgres:
    enabled: true
    
  pop_kafka:
    enabled: true

  pop_server:
    enabled: true
