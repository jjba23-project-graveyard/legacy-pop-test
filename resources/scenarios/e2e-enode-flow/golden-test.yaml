pop_services:
  - id: 'vehicle-events-hub'
    dir: '$HOME/Ontwikkeling/Werk/Vandebron/batterypack/vehicle-events-hub'
    base_url: 'http://localhost:8307'
    start_cmd_args:
      - 'target/universal/stage/bin/start'
    health_check:
      path: '/health'
      patience_seconds: 180
    kafka:
      enabled: true
      
  - id: 'dynamic-tariff-charging'
    dir: '$HOME/Ontwikkeling/Werk/Vandebron/batterypack/dynamic-tariff-charging'
    base_url: 'http://localhost:8222'
    start_cmd_args:
      - 'target/universal/stage/bin/start'
    health_check:
      path: '/health'
      patience_seconds: 180
    postgres:
      enabled: true
    kafka:
      enabled: true
    keycloak:
      enabled: true        
    pop_server:
      enabled: true
      url_vars:
        - 'OCPP_FACADE_URL'
        - 'DYNAMIC_TARIFF_SERVICE_URL'  


pop_actions:
  - name: 'Service should return 400 due to missing header'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 400
    assert_url: '/api/v1/enode/events'
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00" 
      }]
  - name: 'Service should return 401 due to invalid signature'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 401
    assert_url: '/api/v1/enode/events'
    extra_headers:
      x-enode-delivery: "c876e59d-443e-4ac4-897e-fd0b2a93db91"
      x-enode-signature: "some-sha1"     
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00" 
      }]      
      
  - name: 'Service should accept user:vehicle:updated event'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 200
    assert_url: '/api/v1/enode/events'
    extra_headers:
      x-enode-delivery: "c876e59d-443e-4ac4-897e-fd0b2a93db91"
      x-enode-signature: "${BODY_SHA1}" 
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00",
          "vehicle": {
            "id": "fc83e067-77da-4d00-8cf2-d90ebfad9fea",
            "userId": "3f482623-701f-4402-9eb8-067f54b974f7",
            "chargeState": {
              "isPluggedIn": true,
              "range": 300,
              "batteryCapacity": 22,
              "chargeLimit": 100,
              "batteryLevel": 23
            },
            "location": {
              "id": "ef15ca60-ab40-4ab2-8e6f-70a202aef4c5"
            }
          },
          "updatedFields": ["isPluggedIn"]
      }]


  - name: 'Check offsets in Kafka topic'
    delay_seconds: 3
    check: 'check-offsets'

  - name: 'Check that the vehicle got saved to the database'
    delay_seconds: 3
    postgres_query: "SELECT vehicle_id FROM vehicle_latest_state"
    assert_row_count: 1
    assert_expressions:
      - '[0] ((uuid))'    

pop_keycloak:
  enabled: true
  realm: 'vandebron'
  client_id: 'batterypack-services'
  client_secret: 'test'
  email: 'battery@pack.com'
  username: 'batterpack-services'
  password: 'test'
  scopes:
    - 'urn:vandebron:batterypack:read'
    - 'urn:vandebron:batterypack:write'

pop_postgres:
  enabled: true
  
pop_kafka:
  enabled: true

pop_server:
  enabled: true
  behaviors:
    - path: '/organizations/byReference/232323'
      method: 'GET'
      status: 200
      content_type: 'application/json'
      body: |
        { "OrganizationId": "7761dd85-0cc0-4be6-a77e-64b486e92874" }
    - path: '/'
      method: 'POST'
      status: 200
      content_type: 'application/x-www-form-urlencoded'
      body: |
        {"access_token": "some-token", "expires_in": 900000, "message": "success!", "token_type": "JWT"}
      
        
  
