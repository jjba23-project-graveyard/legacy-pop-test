pop_services:
  - id: 'wikimusic-api'
    dir: '$HOME/Ontwikkeling/Persoonlijk/wikimusic-api'
    base_url: 'http://localhost:50050'
    start_cmd_args:
      - 'stack --nix run -- "./resources/config/pop-test.toml"'
    health_check:
      path: '/system-information'
      patience_seconds: 120

pop_actions:
