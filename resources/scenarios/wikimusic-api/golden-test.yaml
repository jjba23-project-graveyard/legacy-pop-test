pop_services:
  - id: 'wikimusic-api'
    dir: '$HOME/Ontwikkeling/Persoonlijk/wikimusic-api'
    base_url: 'http://localhost:50050'
    start_cmd_args:
      - 'stack --nix run -- "./resources/config/run-local.toml"'
    health_check:
      path: '/system-information'
      patience_seconds: 60

pop_actions:
  - name: 'Check that the songs endpoint works fine'
    assert_url: '/songs'
    assert_code: 200
    service_id: 'wikimusic-api'
