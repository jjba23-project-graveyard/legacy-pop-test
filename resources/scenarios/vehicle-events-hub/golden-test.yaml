pop_services:
  - id: 'vehicle-events-hub'
    dir: '$HOME/Ontwikkeling/Werk/Vandebron'
    base_url: 'http://localhost:8307'
    start_cmd_args:
      - 'sbt "vehicleEventsHub/run"'
    health_check:
      path: '/health'
      patience_seconds: 180
    kafka:
      enabled: true
    keycloak:
      enabled: true        


pop_actions:
  - name: 'Service should return 400 due to missing header'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 400
    assert_url: '/api/v1/enode/events'
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00" 
      }]
  - name: 'Service should return 401 due to invalid signature'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 401
    assert_url: '/api/v1/enode/events'
    extra_headers:
      x-enode-delivery: "c876e59d-443e-4ac4-897e-fd0b2a93db91"
      x-enode-signature: "some-sha1"     
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00" 
      }]      
      
  - name: 'Service should accept user:vehicle:updated event'
    service_id: 'vehicle-events-hub'
    method: 'POST'
    assert_code: 200
    assert_url: '/api/v1/enode/events'
    extra_headers:
      x-enode-delivery: "c876e59d-443e-4ac4-897e-fd0b2a93db91"
      x-enode-signature: "${BODY_SHA1}" 
    message: |
      [{
          "event": "user:vehicle:updated",
          "version": "2024-01-01",
          "createdAt": "2023-12-21T16:14:48.849030+01:00" 
      }]


  - name: 'Check offsets in Kafka topic'
    delay_seconds: 3
    kafka_topic: 'vehicle.registration-state'
    check: 'check-offsets'


pop_keycloak:
  enabled: true
  realm: 'vandebron'
  client_id: 'batterypack-services'
  client_secret: 'test'
  email: 'battery@pack.com'
  username: 'batterpack-services'
  password: 'test'
  scopes:
    - 'urn:vandebron:batterypack:read'
    - 'urn:vandebron:batterypack:write'

pop_kafka:
  enabled: true
